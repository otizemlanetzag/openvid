<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כפתור Popeye</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        .popeye-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 60px;
            background-color: #ffcc00;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            color: black;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .popeye-button:hover {
            background-color: #e6b800;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .popeye-button:active {
            transform: translateY(1px);
        }

        .popeye-icon {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            background-image: url('https://cdn.savedly.net/7fdjhaez');
            background-size: contain;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
    <a href="/popeye" class="popeye-button">
        <div class="popeye-icon"></div>
        Popeye
    </a>
</body>
</html>
