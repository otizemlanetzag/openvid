<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — OpenVid</title>
<style>
:root{color-scheme:dark;--navy:#071b35;--blue:#168bd2;--pale:#eaf7ff}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#dff4ff 0%,#f7fcff 65%,#a6e0f4 100%);color:var(--navy);display:flex;flex-direction:column}
header{min-height:72px;padding:16px clamp(18px,5vw,64px);display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--navy);color:white}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:.04em;color:white;text-decoration:none}
nav{display:flex;gap:20px;flex-wrap:wrap}
nav a{color:#d9f1ff;text-decoration:none;font-weight:700}
nav a:hover,nav a:focus{text-decoration:underline}
main{width:min(100% - 32px,900px);margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:42px 0 54px}
.art{display:block;width:min(100%,620px);max-height:52vh;object-fit:contain;border-radius:18px;box-shadow:0 18px 48px #07335a26}
h1{font-size:clamp(1.7rem,5vw,3rem);margin:28px 0 12px;line-height:1.15}
p{font-size:clamp(1rem,2.4vw,1.2rem);line-height:1.65;margin:0;max-width:680px;color:#25465e;overflow-wrap:anywhere}
.actions{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin-top:28px}
.home{display:inline-block;padding:14px 24px;border-radius:999px;background:var(--blue);color:white;text-decoration:none;font-weight:800;letter-spacing:.04em;box-shadow:0 6px 16px #168bd23d;transition:transform .2s,background .2s}
.home:hover{background:#0872b6;transform:translateY(-2px)}
.back{color:#0b5d91;font-weight:700;text-decoration:underline;text-underline-offset:4px}
footer{height:58px;margin-top:auto;background:linear-gradient(180deg,#70cce9,#1686bd);opacity:.9}
@media(max-width:520px){header{align-items:flex-start;flex-direction:column}nav{gap:14px}main{padding-top:28px}.art{max-height:42vh}}
</style>
</head>
<body>
<header>
<a class="brand" href="./index.html">OpenVid</a>
<nav aria-label="Main navigation"><a href="./index.html">Home</a><a href="./popeye/index.html">Popeye videos</a></nav>
</header>
<main>
<img class="art" src="https://cdn.savedly.net/kjzqzh5a" alt="404 page illustration">
<h1>Urghh...there's nothing here! maybe you tried searching without the q parameter?</h1>
<p>The page you're looking for couldn't be found.</p>
<div class="actions">
<a class="home" href="./index.html">RETURN HOME</a>
<a class="back" href="./popeye/index.html">Back to videos</a>
</div>
</main>
<footer aria-hidden="true"></footer>
</body>
</html>
