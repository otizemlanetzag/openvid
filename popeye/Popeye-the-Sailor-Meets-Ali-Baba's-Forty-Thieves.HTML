<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>popeye for the president</title>
  
  <!-- חיבור לשרתים של גוגל פונטס וייבוא הפונט של הכרזת העצמאות -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Monsieur+La+Doulaise&display=swap" rel="stylesheet">

  <style>
    /* מוודא שכל העמוד תופס את מלוא גובה הדפדפן */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* ממרכז את תיבת התוכן בצורה מושלמת אופקית ואנכית */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fcf9f2; /* צבע רקע עדין בסגנון נייר קלף עתיק */
    }

    /* תיבה המאחדת את הסרטון והטקסט ומסדרת אותם אחד מתחת לשני */
    .video-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 640px;
      max-width: 95%; /* מונע יציאה מהמסך בטלפונים */
    }

    /* הגדרות גודל לסרטון */
    video {
      width: 100%;
      height: auto;   /* שומר על יחס הגובה-רוחב המקורי */
      display: block;
    }

    /* עיצוב שם הסרטון מתחת לנגן עם פונט הכרזת העצמאות */
    .video-title {
      margin-top: 15px; /* מרחק קטן בין הסרטון לטקסט */
      font-family: 'Monsieur La Doulaise', cursive; /* הפונט ההיסטורי החדש */
      font-size: 42px;   /* גודל מותאם אישית לפונט קליגרפי */
      font-weight: 400;  /* משקל רגיל כדי לשמור על קליגרפיה חלקה ולא עבה מדי */
      color: #222;       /* צבע הטקסט */
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- תיבת המכולה שמחזיקה את הסרטון והשם שלו יחד במרכז -->
  <div class="video-container">
    <video controls>
      <source src="https://cdn.savedly.net/9ctsvndu">
      sorry, we have an error. try switching to another browser.
    </video>
    
    <!-- שם הסרטון שהתווסף למטה עם הפונט החדש -->
       <!-- שם הסרטון שהתווסף למטה עם הפונט החדש -->
    <div class="video-title">Popeye the Sailor Meets Ali Baba's Forty Thieves</div>

  </div>

</body>
</html>
