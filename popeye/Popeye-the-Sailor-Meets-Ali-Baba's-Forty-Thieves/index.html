<script>
(() => {
 const video=document.getElementById('video');
 const track=document.getElementById('english-captions');
 const captions=document.getElementById('captions');
 const progress=document.getElementById('progress');
 const fill=document.getElementById('progress-fill');
 const knob=document.getElementById('knob');
 const speed=document.getElementById('speed');
 const volume=document.getElementById('volume');
 const rates=[1,1.25,1.5,1.75,2,0.5,0.75];
 let rateIndex=0;
 const showCaptions=()=>{if(track.track)track.track.mode='showing';captions.setAttribute('aria-pressed','true');captions.setAttribute('aria-label','Turn captions off');};
 const hideCaptions=()=>{if(track.track)track.track.mode='disabled';captions.setAttribute('aria-pressed','false');captions.setAttribute('aria-label','Turn captions on');};
 track.addEventListener('load',showCaptions);
 video.addEventListener('loadedmetadata',showCaptions);
 captions.addEventListener('click',()=>captions.getAttribute('aria-pressed')==='true'?hideCaptions():showCaptions());
 video.addEventListener('click',()=>video.paused?video.play():video.pause());
 video.addEventListener('timeupdate',()=>{
  const pct=video.duration?video.currentTime/video.duration*100:0;
  fill.style.width=pct+'%';knob.style.left=pct+'%';
  progress.setAttribute('aria-valuenow',String(Math.round(pct)));
 });
 const seek=e=>{
  if(!video.duration)return;
  const r=progress.getBoundingClientRect();
  video.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*video.duration;
 };
 progress.addEventListener('click',seek);
 progress.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();if(video.duration)video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+(e.key==='ArrowRight'?5:-5)));}
  if(e.key==='Home'){video.currentTime=0;}
  if(e.key==='End'&&video.duration){video.currentTime=video.duration;}
 });
 speed.addEventListener('click',()=>{rateIndex=(rateIndex+1)%rates.length;video.playbackRate=rates[rateIndex];speed.textContent=video.playbackRate.toFixed(2).replace(/0$/,'')+'X';});
 volume.addEventListener('click',()=>{video.muted=!video.muted;volume.setAttribute('aria-label',video.muted?'Unmute audio':'Mute audio');volume.style.opacity=video.muted?'.5':'1';});
 showCaptions();
})();
</script>
