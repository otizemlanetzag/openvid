<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popeye the Sailor Meets Ali Baba's Forty Thieves</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;padding:clamp(1rem,4vw,2rem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#fcf9f2;color:#222;font-family:Arial,sans-serif}
.video-container{display:flex;flex-direction:column;align-items:center;gap:1rem;width:min(100%,960px)}video{width:100%;height:auto;max-height:75vh;background:#000;display:block}.video-title{font-size:clamp(1.4rem,4vw,2.5rem);text-align:center;overflow-wrap:anywhere}
.caption-control{border:0;border-radius:8px;padding:.7rem 1rem;background:#172f4d;color:#fff;font:inherit;font-weight:bold;cursor:pointer}.caption-control:hover{background:#254b75}
video::cue{background:rgba(0,0,0,.85);color:#fff;font-size:1.15rem}
.navigation{display:flex;justify-content:center;flex-wrap:wrap;gap:.75rem}.navigation a{display:inline-block;padding:.7rem 1rem;border-radius:8px;background:#1769aa;color:#fff;text-decoration:none}.navigation a:hover{background:#0f4f85}
.site-search{display:flex;gap:8px;align-items:center;width:min(100% - 32px,560px);margin:16px auto;padding:0}.site-search input{min-width:0;flex:1;padding:11px 13px;border:1px solid #b7c8d5;border-radius:9px;font:inherit}.site-search button{padding:11px 17px;border:0;border-radius:9px;background:#168bd2;color:#fff;font:inherit;font-weight:bold;cursor:pointer}.site-search button:hover{background:#0872b6}</style>
</head>
<body>
<form class="site-search" action="../../search.html" method="get" role="search"><input type="search" name="q" placeholder="Search videos..." aria-label="Search videos" required><button type="submit">Search</button></form>
<main class="video-container">
<video controls playsinline preload="metadata">
<source src="https://archive.org/download/popeye-the-sailor-meets-ali-babas-forty-thieves-1937_202405/Popeye%20the%20Sailor%20Meets%20Ali%20Baba%27s%20Forty%20Thieves%20%281937%29.mp4" type="video/mp4">
<track id="english-captions" kind="subtitles" src="./Popeye-the-Sailor-Meets-Ali-Baba%27s-Forty-Thieves.vtt" srclang="en" label="English" default>
Your browser could not play this video. Try opening it in another browser.
</video>
<button class="caption-control" id="caption-toggle" type="button" aria-pressed="true">Turn captions off</button>
<div class="video-title">Popeye the Sailor Meets Ali Baba's Forty Thieves</div>
<nav class="navigation" aria-label="Navigation"><a href="../index.html">All Popeye Videos</a><a href="../index.html">Home</a></nav>
</main>
<script>
(() => {
  const video = document.querySelector("video");
  const track = document.getElementById("english-captions");
  const button = document.getElementById("caption-toggle");
  if (!video || !track || !button) return;
  const textTrack = track.track;
  const show = () => { textTrack.mode = "showing"; button.textContent = "Turn captions off"; button.setAttribute("aria-pressed", "true"); };
  const hide = () => { textTrack.mode = "disabled"; button.textContent = "Turn captions on"; button.setAttribute("aria-pressed", "false"); };
  track.addEventListener("load", show);
  video.addEventListener("loadedmetadata", show);
  button.addEventListener("click", () => textTrack.mode === "showing" ? hide() : show());
  show();
})();
</script>
<script>
(async()=>{
 try{
  const response=await fetch("../../videos.csv",{cache:"no-store"});
  if(!response.ok)throw Error("videos.csv unavailable");
  const text=await response.text();
  const parse=line=>{const a=[];let v="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&q&&line[i+1]==='"'){v+='"';i++;}else if(c==='"')q=!q;else if(c===','&&!q){a.push(v);v="";}else v+=c;}a.push(v);return a;};
  const lines=text.trim().split(/\r?\n/);const headers=parse(lines.shift()).map(x=>x.trim());
  const rows=lines.filter(x=>x.trim()).map(line=>{const values=parse(line),o={};headers.forEach((k,i)=>o[k]=(values[i]||"").trim());return o;});
  const item=rows.find(v=>(v.name||"").toLowerCase()==="popeye the sailor meets ali baba's forty thieves".toLowerCase());
  const video=document.querySelector("video");
  if(item&&video&&item.url){let source=video.querySelector("source");if(!source){source=document.createElement("source");source.type="video/mp4";video.prepend(source);}source.src=item.url;video.load();}
 }catch(error){console.error("Could not load video source from videos.csv",error);}
})();
</script>
</body>
</html>
