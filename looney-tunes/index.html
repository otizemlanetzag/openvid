<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse Looney Tunes cartoons on OpenVID.">
<title>Looney Tunes — OpenVID</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:clamp(1rem,4vw,3rem);background:#fcf9f2;color:#222}
.site-search{display:flex;gap:8px;align-items:center;width:min(100%,560px);margin:0 0 1.5rem auto}
.site-search input{min-width:0;flex:1;padding:11px 13px;border:1px solid #b7c8d5;border-radius:9px;font:inherit}
.site-search button{padding:11px 17px;border:0;border-radius:9px;background:#168bd2;color:#fff;font:inherit;font-weight:bold;cursor:pointer}
.site-search button:hover{background:#0872b6}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}h1{margin:0;font-size:clamp(1.5rem,4vw,2rem)}
.files{display:flex;flex-wrap:wrap;gap:.75rem}.button{display:inline-block;padding:.8rem 1rem;background:#1769aa;color:#fff;text-decoration:none;border-radius:8px;overflow-wrap:anywhere}.button:hover{background:#0f4f85}.home{color:#1769aa;text-decoration:none;font-weight:bold}
@media(max-width:480px){.site-search{margin-right:0}}
</style>
</head>
<body>
<form class="site-search" action="../search.html" method="get" role="search"><input type="search" name="q" placeholder="Search videos..." aria-label="Search videos" required><button type="submit">Search</button></form>
<header><h1>Looney Tunes Videos</h1><a class="home" href="../index.html">Back to Home</a></header>
<main class="files" id="video-list"><p>Loading videos…</p></main>
<script>
(async()=>{
 const root=document.getElementById("video-list");
 const parse=line=>{const a=[];let v="",q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&q&&line[i+1]==='"'){v+='"';i++;}else if(c==='"')q=!q;else if(c===','&&!q){a.push(v);v="";}else v+=c;}a.push(v);return a;};
 try{
  const response=await fetch("../videos.csv",{cache:"no-store"});if(!response.ok)throw Error("CSV unavailable");
  const lines=(await response.text()).trim().split(/\r?\n/);const headers=parse(lines.shift()).map(x=>x.trim());
  const videos=lines.filter(x=>x.trim()).map(line=>{const values=parse(line),o={};headers.forEach((k,i)=>o[k]=(values[i]||"").trim());return o;}).filter(v=>v.category==="looney-tunes");
  root.replaceChildren();
  videos.forEach(v=>{const a=document.createElement("a");a.className="button";a.href=v.page||v.url;a.textContent=v.name; if(!v.page){a.target="_blank";a.rel="noopener noreferrer";a.title="Open video file";}root.appendChild(a);});
  if(!videos.length)root.textContent="No videos found in videos.csv.";
 }catch(e){root.textContent="Could not load videos.csv. Please refresh.";console.error(e);}
})();
</script>
</body>
</html>
